# Settings of the queries, as data extensions. Every extensible predicate is declared
# here with no rows: a team sets its own values in a model pack (docs/user-guide.md,
# "Configuring queries"), and the query uses its default when there are none.
extensions:
  # ada/cyclomatic-complexity (codeql/ada/metrics/Limits.qll): the limit; 10 when
  # there is no row, the smallest row when there are several.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: cyclomaticComplexityThreshold
    data: []
  # ada/duplicate-initialization-calls (codeql/ada/adacontrol/Settings.qll): the
  # initialization procedures, by qualified name; procedures named Init or Initialize
  # when there is no row.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: initializationProcedure
    data: []
  # ada/exception-propagation (codeql/ada/adacontrol/Settings.qll): call-back
  # parameters, as [subprogram's qualified name, parameter name]; none by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: callbackParameter
    data: []
  # ada/max-call-depth (codeql/ada/adacontrol/Settings.qll): the largest call depth
  # allowed; 15 when there is no row.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: maxCallDepth
    data: []
  # ada/not-elaboration-calls (codeql/ada/adacontrol/Settings.qll): the subprograms,
  # by qualified name, or "new" for allocators, to call only during elaboration; none
  # by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: notElaborationCall
    data: []
