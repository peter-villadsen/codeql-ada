name: CI

# A full run rebuilds nothing on a warm cache but still extracts five corpus
# projects, so it costs ~12 minutes of Actions time. Documentation-only pushes
# skip it. The list is explicit rather than `**.md` on purpose:
# docs/cfg-design.md is *verified* by the "Check CFG coverage appendix" step
# below, so a change to it must still run CI. Do not collapse this to a glob.
on:
  push:
    # Branches only: a `v*` tag push is covered by release.yml, which runs the test
    # suite itself, and the tagged commit has already been through CI on its branch.
    # Without this filter a tag push runs CI as well, a duplicate of the branch run.
    branches: ['**']
    paths-ignore: &docs-only
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'BURNDOWN.md'
      - 'DECISIONS.md'
      - 'LICENSE'
      - 'docs/user-guide.md'
      - 'docs/query-writing.md'
      - 'docs/ci-integration.md'
      - 'docs/releasing.md'
      - 'docs/dbscheme-conventions.md'
      - 'docs/phase*.md'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

env:
  CODEQL_CLI_VERSION: "2.25.6"
  # Bump this when you want to force a fresh Libadalang build (e.g. after
  # intentionally moving the pins in scripts/build-libadalang.sh, or if
  # upstream `master` drifted and the cache is now stale for a reason the
  # script's own text doesn't capture — see BURNDOWN.md top risk #1).
  LAL_CACHE_VERSION: "v1"

jobs:
  ada:
    # Matches the only environment this extractor has been verified on
    # (burndown 1.1/D-008): Debian 13, apt-provided GNAT/gprbuild. Ubuntu's
    # package set/GNAT version is untested and may hit the same GNAT-version
    # traps build-libadalang.sh works around for Debian.
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    steps:
      - name: Install OS packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl unzip \
            build-essential gnat gprbuild python3 python3-venv python3-dev \
            libgmp-dev pkg-config libxmlada-dom-dev libxmlada-input-dev \
            libxmlada-sax-dev libxmlada-schema-dev libxmlada-unicode-dev

      - uses: actions/checkout@v4

      - name: Restore Libadalang build cache
        id: lal-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/adacore
            ~/src
          key: lal-${{ env.LAL_CACHE_VERSION }}-${{ hashFiles('scripts/build-libadalang.sh') }}

      - name: Build Libadalang
        if: steps.lal-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-libadalang.sh

      # Split restore/save (rather than one actions/cache step) so the cache is written as
      # soon as the build succeeds. actions/cache's save-post-step only runs if the whole job
      # succeeds, so a later, unrelated failure (e.g. QL tests, corpus regression) would
      # otherwise silently discard a good build every time and force a full ~45min rebuild
      # on every subsequent run.
      - name: Save Libadalang build cache
        if: steps.lal-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/adacore
            ~/src
          key: ${{ steps.lal-cache.outputs.cache-primary-key }}

      - name: Restore CodeQL CLI cache
        id: codeql-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/codeql-cli
          key: codeql-cli-${{ env.CODEQL_CLI_VERSION }}

      - name: Download CodeQL CLI
        if: steps.codeql-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/codeql.zip \
            "https://github.com/github/codeql-cli-binaries/releases/download/v${CODEQL_CLI_VERSION}/codeql-linux64.zip"
          mkdir -p ~/codeql-cli
          unzip -q /tmp/codeql.zip -d ~/codeql-cli

      - name: Save CodeQL CLI cache
        if: steps.codeql-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: ~/codeql-cli
          key: ${{ steps.codeql-cache.outputs.cache-primary-key }}

      - name: Add CodeQL to PATH
        run: echo "$HOME/codeql-cli/codeql" >> "$GITHUB_PATH"

      # Committing codeql-pack.lock.yml is not enough: the lock file pins the
      # version, but the pack still has to be downloaded into the local cache
      # before anything can compile against it. A developer machine usually has
      # it already, so this only ever fails on a clean checkout -- which is why
      # it went unnoticed from Phase 7.0 (when codeql/controlflow was added) to
      # the first push that carried it.
      # Lib before src before test, matching the dependency order.
      - name: Install QL pack dependencies
        run: |
          set -euo pipefail
          for pack in ql/lib ql/src ql/test; do
            codeql pack install "$pack" --additional-packs=ql
          done

      - name: Check CFG coverage appendix (Phase 7.7)
        run: python3 scripts/check_cfg_coverage.py

      - name: Run QL test suite (Phase 5.2)
        run: codeql test run ql/test --search-path=extractors --additional-packs=ql

      - name: Run corpus regression (Phase 5.3)
        run: python3 scripts/corpus_regression.py --out corpus-report.json

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: corpus-report.json
