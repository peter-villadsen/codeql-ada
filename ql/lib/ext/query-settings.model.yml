# Settings of the queries, as data extensions. Every extensible predicate is declared
# here with no rows: a team sets its own values in a model pack (docs/user-guide.md,
# "Configuring queries"), and the query uses its default when there are none.
extensions:
  # ada/cyclomatic-complexity (codeql/ada/metrics/Limits.qll): the limit; 10 when
  # there is no row, the smallest row when there are several.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: cyclomaticComplexityThreshold
    data: []
  # ada/duplicate-initialization-calls (codeql/ada/adacontrol/Settings.qll): the
  # initialization procedures, by qualified name; procedures named Init or Initialize
  # when there is no row.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: initializationProcedure
    data: []
  # ada/exception-propagation (codeql/ada/adacontrol/Settings.qll): call-back
  # parameters, as [subprogram's qualified name, parameter name]; none by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: callbackParameter
    data: []
  # ada/max-call-depth (codeql/ada/adacontrol/Settings.qll): the largest call depth
  # allowed; 15 when there is no row.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: maxCallDepth
    data: []
  # ada/not-elaboration-calls (codeql/ada/adacontrol/Settings.qll): the subprograms,
  # by qualified name, or "new" for allocators, to call only during elaboration; none
  # by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: notElaborationCall
    data: []
  # ada/potentially-blocking-operations (codeql/ada/adacontrol/Settings.qll): further
  # potentially blocking subprograms, by qualified name; the language-defined
  # input-output packages' always are.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: blockingSubprogram
    data: []
  # ada/side-effect-parameters (codeql/ada/adacontrol/Settings.qll): functions with
  # side effects, as [qualified name, group]; none by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: sideEffectFunction
    data: []
  # ada/type-usage (codeql/ada/adacontrol/Settings.qll): uses of types to report, as
  # [usage ("index" or "'Attribute"), type (category or qualified name), aspect
  # condition ("" or "[not] representation|pack|size|component_size")]; none by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: typeUsage
    data: []
  # ada/unsafe-paired-calls (codeql/ada/adacontrol/Settings.qll): paired procedures, as
  # [opening, closing, lock type or ""], by qualified name; none by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: pairedCalls
    data: []
  # ada/usage (codeql/ada/adacontrol/Settings.qll): the entities to report, as [class,
  # conditions ("written, not read", "not called, from_spec")]; none by default.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: usage
    data: []
  # ada/style (codeql/ada/adacontrol/Settings.qll): the subrules to check, as
  # [subrule, parameter]; the query's default subrules when there is no row.
  - addsTo:
      pack: peter-villadsen/ada-all
      extensible: styleCheck
    data: []
